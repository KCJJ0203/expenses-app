name: SW version guard

# The service worker serves scripts/fonts/manifest cache-first, frozen at install. A deploy
# that changes one of them WITHOUT bumping sw.js VERSION ships fresh HTML calling stale JS on
# every installed client, forever. This guard fails the push so the miss is caught immediately.
on:
  push:
    branches: [main]
    paths:
      - scripts/*.js
      - fonts/**
      - manifest.json
      - icon*.png
      - icon.svg

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require a sw.js VERSION change alongside cached-asset changes
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then echo "no parent commit - skipping"; exit 0; fi
          if git diff --name-only HEAD^ HEAD | grep -qv '\.test\.js$' && git diff HEAD^ HEAD -- sw.js | grep -q '^[+-]const VERSION'; then
            echo "VERSION bumped - ok"
          elif ! git diff --name-only HEAD^ HEAD -- scripts fonts manifest.json icon.svg 'icon*.png' | grep -qv '\.test\.js$'; then
            echo "only test files changed - ok"
          else
            echo "::error::A service-worker-cached asset changed but sw.js VERSION was not bumped. Bump VERSION in sw.js."
            exit 1
          fi
